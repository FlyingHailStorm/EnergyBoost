<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EnergyBoost</title>
    <style>
      :root {
        --bg: #fff0ef;
        --card: rgba(255, 255, 255, 0.8);
        --rose: #d9436b;
        --rose-dark: #622b37;
        --gold: #f7c86e;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: ui-rounded, 'Trebuchet MS', sans-serif;
        background: radial-gradient(circle at top, #fff9f8 0%, var(--bg) 35%, #ffe4de 100%);
        color: var(--rose-dark);
      }

      main {
        width: min(92vw, 420px);
        background: var(--card);
        border: 2px solid rgba(98, 43, 55, 0.08);
        border-radius: 30px;
        padding: 2rem 1.5rem;
        box-shadow: 0 18px 50px rgba(98, 43, 55, 0.08);
        text-align: center;
      }

      .tag {
        display: inline-block;
        background: #fff1b8;
        color: #8a3a48;
        font-size: 0.7rem;
        font-weight: 800;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        padding: 0.6rem 0.9rem;
        border-radius: 999px;
        margin-bottom: 1rem;
      }

      h1 {
        margin: 0.4rem 0 1rem;
        font-size: clamp(2rem, 6vw, 3rem);
      }

      .button {
        width: 100%;
        border: 0;
        border-radius: 18px;
        padding: 1rem 1.2rem;
        font: 800 1.05rem/1.2 ui-rounded, 'Trebuchet MS', sans-serif;
        color: white;
        background: linear-gradient(135deg, #f25b8c, #d93371 40%, #a62d54);
        cursor: pointer;
        transition: transform 0.15s ease, box-shadow 0.15s ease;
        box-shadow: 0 12px 22px rgba(217, 51, 113, 0.3);
      }

      .button:hover {
        transform: translateY(-1px);
      }

      .button:active {
        transform: translateY(1px);
      }

      #status {
        margin-top: 1rem;
        min-height: 1.5em;
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <main>
      <span class="tag">🐓 Rooster's Recharge Station</span>
      <h1>Hey Piggy!</h1>
      <button class="button" id="boost" type="button">TOP UP MY ENERGY +100</button>
      <p id="status">Rooster is ready when you are, Piggy.</p>
    </main>

    <script>
      const boost = document.getElementById('boost');
      const status = document.getElementById('status');
      const labels = ['TOP UP MY ENERGY +100', 'I want to see my man!'];
      let currentIndex = 0;

      boost.addEventListener('click', () => {
        currentIndex = (currentIndex + 1) % labels.length;
        boost.textContent = labels[currentIndex];
        status.textContent = currentIndex === 1
          ? 'Now that is the kind of energy we like.'
          : 'Rooster is ready when you are, Piggy.';
      });
    </script>
  </body>
</html>
