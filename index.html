<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff0ef"><meta name="description" content="A little energy from Rooster to Piggy, whenever you need it."><title>Piggy Power 🐷⚡</title><style>
:root{font-family:ui-rounded,'Trebuchet MS',system-ui,sans-serif;color:#622b37;background:#fff0ef}*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(circle at 8% 12%,#fff9d8,transparent 32%),radial-gradient(circle at 90% 75%,#ffcadc,transparent 38%),linear-gradient(145deg,#fff1e6,#ffe2ec);display:grid;place-items:center;padding:22px}main{position:relative;width:min(100%,480px);border:2px solid #fff9;border-radius:34px;padding:30px 25px 23px;text-align:center;background:#ffffffb8;box-shadow:0 18px 60px #c66b8533;overflow:hidden;backdrop-filter:blur(12px)}.tag{display:inline-block;border-radius:30px;padding:8px 15px;background:#fff1b9;color:#9b4e19;font-weight:800;font-size:12px;letter-spacing:.09em}.characters{display:flex;align-items:center;justify-content:center;gap:12px;font-size:74px;line-height:1.5;filter:drop-shadow(0 6px 4px #bb556022)}.heart{font-size:37px;animation:pulse 2s infinite}h1{font-size:clamp(32px,8vw,43px);margin:0;color:#cf396d;letter-spacing:-1px}p{line-height:1.55;margin:12px 0}.sub{color:#8d5261}.meter{margin-top:25px;text-align:left}.meter-title{display:flex;justify-content:space-between;font-weight:800;margin-bottom:9px}.track{height:24px;border-radius:99px;background:#f9cfda;overflow:hidden;border:3px solid white;box-shadow:inset 0 2px 6px #a9436322}.fill{height:100%;width:24%;border-radius:99px;background:linear-gradient(90deg,#ff996b,#ffcf43);transition:width 1s cubic-bezier(.2,.8,.2,1),background .5s}.button{width:100%;border:0;border-radius:18px;margin-top:21px;background:linear-gradient(130deg,#f25b8b,#d9346b);color:white;padding:17px 16px;font:800 18px ui-rounded,'Trebuchet MS',sans-serif;cursor:pointer;box-shadow:0 8px 0 #b62d5b,0 12px 24px #d9346b33;transition:transform .12s}.button:active{transform:translateY(5px);box-shadow:0 3px 0 #b62d5b}.button:focus-visible,.reset:focus-visible{outline:3px solid #7135b5;outline-offset:3px}.result{min-height:85px;display:grid;place-items:center;font-weight:700;color:#be396c}.result strong{display:block;font-size:22px;margin-bottom:3px}.reset{font:700 13px inherit;border:none;background:transparent;color:#965a6e;text-decoration:underline;cursor:pointer;padding:8px}.footer{margin:19px 0 0;font-size:12px;color:#a1727e}.spark{position:absolute;pointer-events:none;animation:burst 1.7s ease-out forwards;font-size:23px;z-index:2}@keyframes burst{0%{opacity:0;transform:translateY(0) scale(.4) rotate(0)}20%{opacity:1}100%{opacity:0;transform:translateY(-170px) translateX(var(--dx)) rotate(var(--rot)) scale(1.4)}}@keyframes pulse{50%{transform:scale(1.16)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}@media(max-width:360px){main{padding:24px 18px}.characters{font-size:58px}}
</style></head><body><main id="card"><span class="tag">🐓 ROOSTER'S RECHARGE STATION</span><div class="characters" aria-label="Rooster sends love to Piggy"><span>🐓</span><span class="heart">💗</span><span>🐷</span></div><h1>Hey Piggy! 💕</h1><p class="sub">Long week ahead? Your Rooster has you covered.</p><p>Whenever work drains your batteries, come back here for a little extra energy. ⚡</p><div class="meter" aria-label="Energy meter"><div class="meter-title"><span>🔋 Piggy's energy</span><span id="percent">24%</span></div><div class="track" role="progressbar" aria-label="Energy" aria-valuemin="0" aria-valuemax="100" aria-valuenow="24" id="track"><div class="fill" id="fill"></div></div></div><button class="button" id="boost">⚡ TOP UP MY ENERGY +100</button><div class="result" id="result" aria-live="polite">Ready when you are, Piggy! 🐷</div><button class="reset" id="again" hidden>Need another boost? ↻</button><div class="footer">Unlimited refills · No expiry · Sent with a smile 🐓❤️</div></main><script>
(()=>{'use strict';const percent=document.getElementById('percent'),fill=document.getElementById('fill'),track=document.getElementById('track'),boost=document.getElementById('boost'),result=document.getElementById('result'),again=document.getElementById('again'),card=document.getElementById('card');const messages=['Fully charged! Go conquer your week, Piggy! 🌈','Emergency Rooster hug delivered! 🐓🤗🐷','+100 focus · +100 smiles · +100 good vibes 💖','You’ve got this, Piggy. Your Rooster believes in you! ✨'];const reunionSound=new Audio('./rooster-reunion.wav');reunionSound.preload='auto';let count=0;let labelIndex=0;const labels=['⚡ TOP UP MY ENERGY +100','I WANT TO SEE MY MAN!'];function setEnergy(n){percent.textContent=n+'%';fill.style.width=n+'%';fill.style.background=n===100?'linear-gradient(90deg,#3bcf80,#98e458)':'linear-gradient(90deg,#ff996b,#ffcf43)';track.setAttribute('aria-valuenow',String(n));}function confetti(){if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;for(let i=0;i<18;i++){const el=document.createElement('span');el.className='spark';el.textContent=['💗','✨','⚡','🌈','🐷'][i%5];el.style.left=(10+Math.random()*80)+'%';el.style.bottom=(12+Math.random()*25)+'%';el.style.setProperty('--dx',((Math.random()-.5)*260)+'px');el.style.setProperty('--rot',(Math.random()*160-80)+'deg');card.appendChild(el);el.addEventListener('animationend',()=>el.remove(),{once:true});}}boost.addEventListener('click',()=>{if(labelIndex===1){reunionSound.currentTime=0;reunionSound.play().catch(()=>{});}labelIndex=(labelIndex+1)%labels.length;boost.textContent=labels[labelIndex];count++;setEnergy(100);result.innerHTML='<div><strong>🎉 OINK! 100% CHARGED! 🎉</strong><span></span></div>';result.querySelector('span').textContent=messages[(count-1)%messages.length];again.hidden=false;confetti();});again.addEventListener('click',()=>{setEnergy(24);result.textContent='Rooster is ready for another rescue! 🐓';again.hidden=true;labelIndex=0;boost.textContent=labels[labelIndex];});})();
</script></body></html>
