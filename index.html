<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#fff0ef" />
    <meta name="description" content="A little energy from Rooster to Piggy, whenever you need it." />
    <title>Piggy Power</title>
    <style>
      :root {
        font-family: ui-rounded, 'Trebuchet MS', system-ui, sans-serif;
        color: #622b37;
        background: #fff0ef;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100svh;
        background: radial-gradient(circle at 8% 12%, #fff9d8 0%, transparent 32%),
          radial-gradient(circle at 90% 75%, #ffcad8 0%, transparent 35%),
          linear-gradient(145deg, #fff1e6 0%, #fff0ef 100%);
        display: grid;
        place-items: center;
        padding: 22px;
      }

      main {
        position: relative;
        width: min(100%, 420px);
        border: 2px solid #fff9;
        border-radius: 34px;
        padding: 30px 25px 23px;
        text-align: center;
        background: rgba(255, 255, 255, 0.78);
        box-shadow: 0 18px 60px rgba(198, 103, 119, 0.15);
        overflow: hidden;
      }

      .tag {
        display: inline-block;
        border-radius: 30px;
        padding: 8px 15px;
        background: #fff1b9;
        color: #9b4e1a;
        font-weight: 800;
        font-size: 12px;
        letter-spacing: 0.09em;
        text-transform: uppercase;
      }

      .characters {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        font-size: 74px;
        line-height: 1.5;
        margin-top: 8px;
        filter: drop-shadow(0 2px 4px rgba(181,85,102,0.2));
      }

      .heart {
        font-size: 37px;
        animation: pulse 2s infinite;
      }

      @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.15); }
      }

      h1 {
        margin: 0;
        font-size: clamp(32px, 7vw, 48px);
        color: #622b37;
      }

      .sub {
        margin: 12px 0;
        line-height: 1.55;
        color: #8d5261;
      }

      .meter {
        margin-top: 25px;
        text-align: left;
      }

      .meter-title {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-weight: 800;
        margin-bottom: 9px;
        color: #622b37;
      }

      .track {
        position: relative;
        height: 24px;
        border-radius: 99px;
        background: #f9cfda;
        overflow: hidden;
        border: 3px solid white;
        box-shadow: inset 0 2px 6px rgba(169,67,93,0.15);
      }

      .fill {
        height: 100%;
        width: 24%;
        border-radius: 99px;
        background: linear-gradient(90deg, #ff9a76, #ffcf5d);
        transition: width 1s cubic-bezier(.2,.8,.2,1), background 0.5s ease;
      }

      .button {
        width: 100%;
        border: 0;
        border-radius: 18px;
        margin-top: 21px;
        padding: 17px 16px;
        background: linear-gradient(135deg, #f25b8c, #d93371 40%, #a62d54);
        color: white;
        font: 800 18px/1.2 ui-rounded, 'Trebuchet MS', sans-serif;
        cursor: pointer;
        box-shadow: 0 8px 0 rgba(182, 54, 96, 0.35), 0 12px 24px rgba(217, 56, 103, 0.25);
        transition: transform .12s ease, box-shadow .12s ease;
      }

      .button:hover { transform: translateY(-1px); }
      .button:active { transform: translateY(2px); box-shadow: 0 4px 0 rgba(182, 54, 96, 0.35), 0 8px 16px rgba(217, 56, 103, 0.2); }
      .button:focus-visible, .reset:focus-visible { outline: 3px solid #7135b5; outline-offset: 3px; }

      .result {
        min-height: 85px;
        display: grid;
        place-items: center;
        font-weight: 700;
        color: #be395d;
        margin-top: 10px;
      }

      .result strong { display: block; font-size: 22px; }

      .reset {
        display: none;
        width: 100%;
        border: 0;
        border-radius: 18px;
        margin-top: 6px;
        padding: 12px 16px;
        background: transparent;
        color: #8d5261;
        font: 700 16px/1.2 ui-rounded, 'Trebuchet MS', sans-serif;
        cursor: pointer;
      }

      .footer {
        margin-top: 19px;
        font-size: 12px;
        color: #a1727e;
      }

      .spark {
        position: absolute;
        pointer-events: none;
        animation: burst 1.7s ease-out forwards;
      }

      @keyframes burst {
        0% { opacity: 0; transform: translateY(0) scale(.4) rotate(0); }
        20% { opacity: 1; }
        100% { opacity: 0; transform: translateY(-170px) translateX(var(--dx)) rotate(var(--rot)) scale(1.4); }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation: none !important; transition: none !important; }
      }
    </style>
  </head>
  <body>
    <main id="card">
      <span class="tag">🐓 ROOSTER'S RECHARGE STATION</span>
      <div class="characters" aria-label="Rooster sends love to Piggy">
        <span>🐓</span>
        <span class="heart">💖</span>
        <span>🐷</span>
      </div>
      <h1>Hey Piggy!</h1>
      <p class="sub">Long week ahead? Your Rooster has you covered.</p>
      <p class="sub">Whenever work drains your batteries, come back here for a little extra energy.</p>

      <div class="meter" aria-label="Energy meter">
        <div class="meter-title">
          <span>Piggy's energy</span>
          <span id="percent">24%</span>
        </div>
        <div class="track" role="progressbar" aria-label="Energy" aria-valuemin="0" aria-valuemax="100" aria-valuenow="24" id="track">
          <div class="fill" id="fill"></div>
        </div>
      </div>

      <button class="button" id="boost" type="button">TOP UP MY ENERGY +100</button>
      <div class="result" id="result" aria-live="polite">Ready when you are, Piggy! ✨</div>
      <button class="reset" id="again" type="button">Need another boost? ↻</button>
      <div class="footer">Unlimited refills • No expiry • Sent with a smile 😊</div>
    </main>

    <script>
      (() => {
        'use strict';

        const percent = document.getElementById('percent');
        const fill = document.getElementById('fill');
        const track = document.getElementById('track');
        const boost = document.getElementById('boost');
        const result = document.getElementById('result');
        const again = document.getElementById('again');
        const card = document.getElementById('card');
        const messages = [
          'Fully charged! Go conquer your week, Piggy! ✨',
          'Emergency Rooster hug delivered! 💗',
          '100 focus flow • 100 smiles • 100 good vibes ✨',
          "You've got this, Piggy. Your Rooster believes in you! 💪",
          'Rooster is ready for another rescue! 🐓'
        ];

        let count = 0;
        let labelIndex = 0;
        const labels = ['TOP UP MY ENERGY +100', 'I WANT TO SEE MY MAN!'];

        function setEnergy(n) {
          percent.textContent = n + '%';
          fill.style.width = n + '%';
          fill.style.background = n === 100 ? 'linear-gradient(90deg, #3bcf80, #98e458)' : 'linear-gradient(90deg, #ff9a76, #ffcf5d)';
          track.setAttribute('aria-valuenow', String(n));
        }

        function confetti() {
          if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
          for (let i = 0; i < 18; i++) {
            const el = document.createElement('span');
            el.className = 'spark';
            el.textContent = ['✨', '💫', '🌟', '💖'][Math.floor(Math.random() * 4)];
            el.style.left = (10 + Math.random() * 80) + 'px';
            el.style.bottom = (12 + Math.random() * 25) + 'px';
            el.style.setProperty('--dx', ((Math.random() - 0.5) * 260) + 'px');
            el.style.setProperty('--rot', (Math.random() * 180 - 90) + 'deg');
            card.appendChild(el);
            el.addEventListener('animationend', () => el.remove(), { once: true });
          }
        }

        boost.addEventListener('click', () => {
          count += 1;
          setEnergy(100);
          result.innerHTML = '<div><strong>' + messages[(count - 1) % messages.length] + '</strong><span></span></div>';
          result.querySelector('span').textContent = '';
          again.hidden = false;
          labelIndex = (labelIndex + 1) % labels.length;
          boost.textContent = labels[labelIndex];
          confetti();
        });

        again.addEventListener('click', () => {
          setEnergy(24);
          result.textContent = 'Rooster is ready for another rescue! 🐓';
          again.hidden = true;
          labelIndex = 0;
          boost.textContent = labels[labelIndex];
        });
      })();
    </script>
  </body>
</html>
